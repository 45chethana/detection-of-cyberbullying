{% extends "base.html" %} 
{% block content %}

{% load static %}

<!-- contact section -->
<section class="contact_section layout_padding">
    <div class="container-fluid">
      <div class="col-lg-4 col-md-5 offset-md-1">
        <div class="heading_container">
          <h2>
            Enter your Text
          </h2>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-4 col-md-5 offset-md-1">
          <div class="form_container">
            <form  method="post">
                {% csrf_token %}
                
              <div>
                <input type="text" class="message-box" placeholder="Predicted output: {{cyber}}"name="cyber" />
              </div>
              
              <div class="btn_box"><button type="submit" >submit</button>
              </div>
            </form>
            {% for i in messages %}
            <script>alert("{{i}}")</script>
            {% endfor %}
          </div>
        </div>
        <div class="col-lg-7 col-md-6 px-0">
          <div class="map_container">
            <div class="map">
              <div id="googleMap"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- end contact section -->


{% endblock %}
